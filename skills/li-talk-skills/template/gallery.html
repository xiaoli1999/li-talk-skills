    var known = (window.LI_TALK_STYLES || []).filter(function (s) { return I.SCENES[s.key]; });
    // index.json 里没写、却注册了的风格也放上（名字取注册表的）
    keys.forEach(function (k) {
      if (!known.some(function (s) { return s.key === k; })) known.push({ key: k, label: I.SCENES[k].label || k, family: I.SCENES[k].family, mascot: I.SCENES[k].mascot });
    });

    var box = el('div', 'sv-home');
    box.setAttribute('role', 'main');
    box.tabIndex = -1;
    var wrap = el('div', 'sv-wrap');
    wrap.appendChild(el('p', 'sv-eyebrow', 'li-talk-skills 样册'));
    var head = el('header', 'sv-head');
    head.appendChild(el('h1', '', known.length + ' 种风格'));
    head.appendChild(el('p', '', '点一张卡片，从第一页看这种风格的样板页；看的时候 ← → 翻页，左下角的小条随时换风格，点「全部风格」回到这里。同一份课件按章换风格时，只在同一家里换。'));
    wrap.appendChild(head);
    var fams = el('div', 'sv-fams');
    var minis = [];
    var groups = FAMS.map(function (f) { return f; });
    known.forEach(function (s) { if (!groups.some(function (f) { return f[0] === s.family; })) groups.push([s.family, FAMILY[s.family] || s.family, '']); });
    groups.forEach(function (f) {
      var list = known.filter(function (s) { return s.family === f[0]; });
      if (!list.length) return;
      var sec = el('section', 'sv-fam');
      sec.style.setProperty('--n', String(list.length));
      var h2 = el('h2', '', f[1]);
      h2.appendChild(el('span', '', (f[2] ? f[2] + ' · ' : '') + list.length + ' 种'));
      sec.appendChild(h2);
      var cards = el('div', 'sv-cards');
      list.forEach(function (s) { cards.appendChild(card(s, minis)); });
      sec.appendChild(cards);
      fams.appendChild(sec);
    });
    wrap.appendChild(fams);
    box.appendChild(wrap);
    // 点击、触屏只给总览自己：不往下传到课件（课件在 document 上听点击翻拍、滑动翻页）
    ['click', 'touchstart', 'touchend'].forEach(function (t) { box.addEventListener(t, function (e) { e.stopPropagation(); }); });
    document.body.appendChild(box);
    try { box.focus({ preventScroll: true }); } catch (e) { /* 老浏览器不认参数 */ }

    // 缩小的舞台按卡片宽度缩放
    var fit = function () { minis.forEach(function (m) { var w = m.parentNode.clientWidth; if (w) m.style.transform = 'scale(' + (w / 1920) + ')'; }); };
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(wrap); else addEventListener('resize', fit);
  }

  // 一张卡片：<a href="?scene=键名">，上半截是缩小的舞台（背景层 + 风格名 + 形象），下半截是样子和适合讲什么
  function card(s, minis) {
    var a = el('a', 'sv-card');
    a.href = '?scene=' + encodeURIComponent(s.key);
    a.dataset.scene = s.key;
    a.setAttribute('aria-label', (s.label || s.key) + '：' + (s.look || '') + (s.fit ? '。适合' + s.fit : '') + '。点开从第一页看');
    var pv = el('span', 'sv-pv');
    pv.setAttribute('aria-hidden', 'true');
    var mini = el('span', 'sv-mini');
    mini.appendChild(backdrop(s.key));
    mini.appendChild(el('span', 'sv-mini-title', s.label || s.key));
    var art = mascot(s.mascot || I.SCENES[s.key].mascot);
    if (art) mini.appendChild(art);
    pv.appendChild(mini);
    pv.appendChild(el('span', 'sv-key', s.key));
    minis.push(mini);
    a.appendChild(pv);
    var info = el('span', 'sv-info');
    if (s.look) info.appendChild(el('span', 'sv-look', s.look));
    if (s.fit) { var fit = el('span', 'sv-fit'); fit.appendChild(el('b', '', '适合')); fit.appendChild(document.createTextNode(s.fit)); info.appendChild(fit); }
    a.appendChild(info);
    return a;
  }

  // 这种风格的背景层：复制引擎建好的那一层（里面有风格 backdrop 放的远山、光斑、图框）；取不到就只铺底色
  function backdrop(key) {
    var src = I.dom && I.dom.bg && I.dom.bg[key];
    var b;
    if (src) { b = src.cloneNode(true); b.removeAttribute('style'); b.removeAttribute('id'); }
    else { b = el('span', 'bg'); b.dataset.scene = key; }
    b.classList.add('on');
    b.setAttribute('aria-hidden', 'true');
    return b;
  }

  // 形象的开心姿势：直接用形象注册的 svg(pose, opts)；画不出来就不画
  function mascot(key) {
    var m = key && I.MASCOTS && I.MASCOTS[key];
    if (!m || typeof m.svg !== 'function') return null;
    var svg = '';
    try { svg = m.svg('happy', { blink: false, flip: false, look: null }); } catch (e) { svg = ''; }
    if (typeof svg !== 'string' || svg.indexOf('<svg') < 0) return null;
    var size = m.size || [120, 120];
    var h = 620, w = Math.round(h * size[0] / size[1]);
    var art = el('span', 'sv-mini-art' + (m.pixel ? ' sv-px' : ''));
    art.style.width = w + 'px';
    art.style.height = h + 'px';
    art.innerHTML = svg;
    return art;
  }

  /* ---------------- 换风格的小条 ---------------- */
  function showBar() {
    var asked = qs.get('scene');
    var cur = asked && I.SCENES[asked] ? asked : (I.DEFS[0] && I.SCENES[I.DEFS[0].scene] ? I.DEFS[0].scene : keys[0]);
    var FOLD = 'li-talk-gallery-folded';
    var folded = innerWidth < 1200;   // 窗口窄时先收起，免得盖住舞台太多；点一下展开
    try { var saved = sessionStorage.getItem(FOLD); if (saved) folded = saved === '1'; } catch (e) { /* 存不了就按窗口宽度 */ }

    var bar = el('nav', 'gl-bar' + (folded ? ' folded' : ''));
    bar.setAttribute('aria-label', '换风格');
    var toggle = el('button', 'gl-toggle');
    toggle.type = 'button';
    var all = el('button', 'gl-all', '全部风格');
    all.type = 'button';
    all.title = '回到风格总览';
    all.addEventListener('click', function () { location.href = home; });
    var list = el('div', 'gl-list');
    var hint = el('span', 'gl-hint', '← → 翻页');
    var setToggle = function () {
      toggle.textContent = folded ? '换风格 ▸' : '风格 ◂';
      toggle.title = folded ? '展开风格列表' : '收起';
      toggle.setAttribute('aria-expanded', folded ? 'false' : 'true');
    };
    setToggle();
    toggle.addEventListener('click', function () {
      folded = !folded;
      bar.classList.toggle('folded', folded);
      setToggle();
      try { sessionStorage.setItem(FOLD, folded ? '1' : '0'); } catch (e) { /* 存不了就算了 */ }
    });

    // 按家分组：手绘家、现代家、像素家（同一份课件只在同一家里混用）
    FAMS.forEach(function (f) {
      var ks = keys.filter(function (k) { return I.SCENES[k].family === f[0]; });
      if (!ks.length) return;
      list.appendChild(el('span', 'gl-fam', FAMILY[f[0]] || f[0]));   // 冒号由 CSS 的 ::after 加，窄窗口不加
      ks.forEach(function (k) {
        var b = el('button', '', I.SCENES[k].label || k);
        b.type = 'button';
        b.title = k;
        if (k === cur) b.setAttribute('aria-current', 'true');
        b.addEventListener('click', function () {
          if (k === cur) return;
          location.href = '?scene=' + encodeURIComponent(k);   // 不带 #页/拍：从第一页开始，播开场
        });
        list.appendChild(b);
      });
    });

    bar.appendChild(toggle);
    bar.appendChild(all);
    bar.appendChild(list);
    bar.appendChild(hint);
    document.body.appendChild(bar);
  }
})();
</script>
</body>
</html>
