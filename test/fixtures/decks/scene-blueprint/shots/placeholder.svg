<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- 截图占位：一张中性的「软件窗口」示意图（冷灰色，不带文字和品牌色），样板页和样册里代替真实截图。
       做自己的课件时换成 素材/ 里的真实截图 -->
  <rect width="1600" height="900" fill="#F3F5F7"/>
  <!-- 标题栏：三个圆点 + 地址栏 -->
  <rect width="1600" height="76" fill="#DDE2E8"/>
  <g fill="#C3CBD4"><circle cx="46" cy="38" r="12"/><circle cx="88" cy="38" r="12"/><circle cx="130" cy="38" r="12"/></g>
  <rect x="210" y="20" width="720" height="36" rx="18" fill="#EDF0F3"/>
  <!-- 侧栏 -->
  <rect y="76" width="360" height="824" fill="#E6EAEE"/>
  <rect x="44" y="132" width="250" height="44" rx="22" fill="#CCD6E0"/>
  <g fill="#D2D8DF">
    <rect x="64" y="218" width="190" height="20" rx="10"/>
    <rect x="64" y="276" width="220" height="20" rx="10"/>
    <rect x="64" y="334" width="170" height="20" rx="10"/>
    <rect x="64" y="392" width="205" height="20" rx="10"/>
    <rect x="64" y="450" width="150" height="20" rx="10"/>
  </g>
  <!-- 正文区：标题行、两行说明、一个按钮 -->
  <rect x="440" y="130" width="500" height="36" rx="18" fill="#C9D0D8"/>
  <rect x="440" y="196" width="760" height="20" rx="10" fill="#DADFE5"/>
  <rect x="440" y="234" width="600" height="20" rx="10" fill="#DADFE5"/>
  <rect x="1324" y="126" width="196" height="46" rx="23" fill="#AFC1D2"/>
  <!-- 大图卡片：太阳和两座山 -->
  <rect x="440" y="296" width="720" height="520" rx="26" fill="#E1E6EB"/>
  <circle cx="1030" cy="430" r="48" fill="#CBD3DC"/>
  <path d="M490 770 L700 520 L820 650 L905 560 L1110 770 Z" fill="#C7D0D9"/>
  <path d="M640 770 L860 600 L1110 770 Z" fill="#BAC5D0"/>
  <!-- 右边两张小卡片 -->
  <rect x="1204" y="296" width="316" height="244" rx="26" fill="#E6EAEE"/>
  <rect x="1244" y="340" width="150" height="22" rx="11" fill="#CDD4DC"/>
  <rect x="1244" y="384" width="230" height="16" rx="8" fill="#D9DEE4"/>
  <rect x="1244" y="416" width="190" height="16" rx="8" fill="#D9DEE4"/>
  <rect x="1244" y="472" width="110" height="34" rx="17" fill="#D2DBE4"/>
  <rect x="1204" y="572" width="316" height="244" rx="26" fill="#E6EAEE"/>
  <rect x="1244" y="616" width="170" height="22" rx="11" fill="#CDD4DC"/>
  <rect x="1244" y="660" width="220" height="16" rx="8" fill="#D9DEE4"/>
  <rect x="1244" y="692" width="160" height="16" rx="8" fill="#D9DEE4"/>
  <rect x="1244" y="748" width="110" height="34" rx="17" fill="#D2DBE4"/>
</svg>
